[package]
name = "vnmf-core"
version = "0.1.0-beta"
edition = "2024"
authors = ["void_nicole (Nicole Hitori)"]
license = "GPL-3.0-or-later"
description = "Core of the VNMF manga/webtoon container format: binary layout, builder and reader"

[dependencies]
thiserror = "2.0.18"
zerocopy = { version = "0.8", features = ["derive"] }
crc32fast = "1.3"
memmap2 = "0.9"
imagesize = "0.15"
log = "0.4"
vnmf-parity = { path = "../vnmf-parity", version = "0.1.0-beta" }
vnmf-i18n = { version = "0.1.0-beta", path = "../vnmf-i18n" }
