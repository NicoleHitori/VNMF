org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Java compiler = the JDK that runs Gradle (bundled with Android Studio). Without this Gradle
# could pick a system JRE without javac (e.g. /usr/lib/jvm/java-25-openjdk on Fedora).
org.gradle.java.installations.auto-detect=false
